[package]
name = "ayrola-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
